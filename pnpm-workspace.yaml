packages:
  - "apps/*"
  - "packages/*"

engineStrict: true

# Dependency install scripts run only if listed here as true (pnpm fails the install on unlisted ones).
allowBuilds:
  # drizzle-kit's esbuild: its postinstall only double-checks the binary, which already arrives as a
  # platform-specific optional dependency. Denied: no third-party code runs at install time.
  esbuild: false

catalog:
  "@biomejs/biome": 2.6.7
  "@fastify/static": 10.1.11
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  fastify: 5.12.8
  # 3.x, not 4.x: drizzle-orm 0.45 predates postgres.js 4 (Oct 2026). Renovate proposes the major later.
  postgres: 3.4.9
  react: 19.3.1
  react-dom: 19.3.1
  tsdown: 0.23.7
  turbo: 2.11.11
  typescript: 7.0.2
  vite: 8.3.8
  vitest: 5.1.0
  zod: 4.6.7
