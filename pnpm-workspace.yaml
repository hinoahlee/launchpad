packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

engineStrict: true

# Dependency install scripts run only if listed here as true (pnpm fails the install on unlisted ones).
allowBuilds:
  # drizzle-kit's esbuild: its postinstall only double-checks the binary, which already arrives as a
  # platform-specific optional dependency. Denied: no third-party code runs at install time.
  esbuild: false

# Forced versions deep in the dependency tree. Remove an entry once the package that pulls in the old version
# updates it.
overrides:
  # drizzle-kit still lists @esbuild-kit/esm-loader, which pins esbuild 0.18 (GHSA-67mh-4wv8-2f99: esbuild's dev
  # server lets any website read its responses). drizzle-kit never loads it (it uses tsx), so this only swaps an
  # unused copy for the 0.25 drizzle-kit already uses.
  "@esbuild-kit/core-utils>esbuild": 0.25.12

# Corrections to packages' own package.json.
packageExtensions:
  # Lists @fastify/swagger and openapi-types as required peers, but only imports their types (for its optional
  # OpenAPI helpers, which we don't use). Optional peers aren't auto-installed, so they stay out of the image.
  fastify-type-provider-zod:
    peerDependenciesMeta:
      "@fastify/swagger":
        optional: true
      openapi-types:
        optional: true

catalog:
  "@biomejs/biome": 2.6.7
  # One version for all three: they share @sentry/core. 11.10.0: the newest release at least two weeks old.
  "@sentry/bundler-plugins": 11.10.0
  "@base-ui/react": 1.9.0
  "@fastify/compress": 9.3.0
  "@fastify/helmet": 13.2.0
  "@fastify/rate-limit": 11.2.2
  "@sentry/node": 11.10.0
  "@sentry/react": 11.10.0
  "@fastify/static": 10.1.11
  "@fontsource-variable/geist": 5.3.0
  # Also the browser build CI installs (`playwright install`), so a bump updates both.
  "@playwright/test": 1.64.1
  "@tailwindcss/vite": 4.3.4
  "@tanstack/react-query": 5.106.0
  "@tanstack/react-router": 1.170.46
  "@tanstack/router-plugin": 1.168.48
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  class-variance-authority: 0.7.1
  # shadcn's class-name merger (clsx + tailwind-merge in one); `shadcn init` installs it since Sep 2026.
  cn: 0.5.2
  # Cron expressions → run times, for recurring jobs. 11.0.0, not 11.0.1: two-week rule.
  croner: 11.0.0
  # Auth (decision 009). Same version for both: the adapter is released with the core. 1.7.18: the newest release
  # at least two weeks old; includes the 1.7.16 security fixes.
  "@better-auth/drizzle-adapter": 1.7.18
  better-auth: 1.7.18
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  fastify: 5.12.8
  fastify-type-provider-zod: 7.0.0
  lucide-react: 1.68.0
  # The version Fastify itself uses, so there is one copy (and one set of types).
  pino: 10.4.0
  # 3.x, not 4.x: drizzle-orm 0.45 predates postgres.js 4 (Oct 2026). Renovate proposes the major later.
  postgres: 3.4.9
  react: 19.3.1
  react-dom: 19.3.1
  # Email templates: components (Html, Text...) and render() to HTML + plain text. Since v6 it also ships its
  # preview CLI as dependencies (~60 MB in the image, never run). 6.11.6: the newest release at least two weeks old.
  react-email: 6.11.6
  # The shadcn/ui CLI (`pnpm --filter @launchpad/web exec shadcn add <component>`), plus the shared Tailwind
  # utilities its components rely on (`@import "shadcn/tailwind.css"`).
  shadcn: 4.23.0
  tailwindcss: 4.3.4
  tsdown: 0.23.7
  # Runs the worker in dev: Node can't load its JSX email templates; tsx converts .ts/.tsx as it loads them. Dev
  # only: production runs the tsdown build. 4.23.15: the version drizzle-kit already uses, so one copy.
  tsx: 4.23.15
  tw-animate-css: 1.4.0
  turbo: 2.11.11
  typescript: 7.0.2
  vite: 8.3.8
  vitest: 5.1.0
  zod: 4.6.7
