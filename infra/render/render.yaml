# Render Blueprint: the Render services for this repo, as code. Render reads this file on every push to main
# (Blueprint auto-sync) and applies changes. Spec: https://render.com/docs/blueprint-spec
# Render doesn't build anything: CI publishes the image to GHCR and deploys it (decision 004).
services:
  - type: web
    name: launchpad
    # Pull a prebuilt image instead of building the Dockerfile, so Render runs the bytes CI built.
    runtime: image
    image:
      # The default reference, used only for deploys Render starts itself (a Blueprint sync, a settings change).
      # CI deploys by digest. `:main` always points at the newest image published from main, so those deploys
      # never roll back to an old one, as a digest pinned here would. Public package: no credentials needed.
      url: ghcr.io/noah-lee/launchpad:main
    # Can't be changed after creation. Oregon is Render's default.
    region: oregon
    # Paid (formerly "Starter", ~$7/mo): 0.5 CPU / 512 MB, always on (no spin-down), pre-deploy commands allowed.
    plan: 0.5c-512mb
    # Every deploy runs this first, in a one-off container from the new image with the same env vars. Non-zero
    # exit = the deploy fails and the old version keeps serving. It applies new migrations, so they must work
    # with the old version too (decision 005).
    preDeployCommand: node dist/migrate.js
    # Render sends traffic to a new deploy only once this returns 2xx; until then the old one keeps serving.
    healthCheckPath: /api/ready
    # Tells Render which service answers for this name, and to issue its TLS certificate. DNS side: a CNAME in
    # Cloudflare, `render` -> this service's onrender.com host, DNS only (grey cloud). Keep in sync with the
    # GitHub repository variable RENDER_URL, which the deploy job polls.
    domains:
      - render.noahlee.xyz
    # NODE_ENV comes from the image; Render sets PORT. Only non-defaults go here.
    envVars:
      - key: LOG_LEVEL
        value: info
      # Two proxies append to X-Forwarded-For before the app: Cloudflare (every Render request passes through it),
      # then Render's load balancer (the socket). The client IP is the entry before theirs.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # Render fills this in with the database's private-network URL (password included) at deploy time; the
      # value never appears in this repo or in GitHub. To use another provider, swap `fromDatabase` for
      # `sync: false` and paste its URL in the dashboard: the app only reads DATABASE_URL.
      - key: DATABASE_URL
        fromDatabase:
          name: launchpad-db
          property: connectionString
      # Sentry project launchpad-api → Client Keys (DSN). `sync: false`: the value lives only in Render's dashboard,
      # never in this file. Unset: error tracking is off. (The web app's DSN is a GitHub variable, baked in by CI.)
      - key: SENTRY_DSN
        sync: false

databases:
  - name: launchpad-db
    # Name and user inside Postgres. These, the version and the region can't be changed after creation.
    databaseName: launchpad
    user: launchpad
    # Same major version as local and CI (phase 5), so dumps and SQL behave the same everywhere.
    postgresMajorVersion: "17"
    region: oregon
    # Smallest paid instance (~$6/mo): point-in-time recovery (3 days on the Hobby workspace), no expiry.
    plan: 0.1c-256mb
    # Storage is billed apart (~$0.30/GB/mo); this plan defaults to 15 GB. Disks can grow later, never shrink.
    diskSizeGB: 1
    # No access from the internet: only services in this Render workspace connect, over the private network.
    # Add a CIDR here (e.g. your IP) for a one-off psql session, then remove it.
    ipAllowList: []
