# Render Blueprint: the Render services for this repo, as code. Render reads this file on every push to main
# (Blueprint auto-sync) and applies changes. Spec: https://render.com/docs/blueprint-spec
# Render doesn't build anything: CI publishes the image to GHCR and deploys it.
# Deploy only through GitHub Actions (push to main, or Actions → Deploy to Render → Run workflow, also for a
# rollback): it deploys the web first (migrations) and the worker after. Render deploys a service on its own when
# it's created, when the Blueprint changes it, or on an env edit saved with "deploy": those use `:main` and skip
# that order. So in the dashboard, save env edits with "Save only", then run the workflow; avoid Manual Deploy.
services:
  - type: web
    name: launchpad
    # Pull a prebuilt image instead of building the Dockerfile, so Render runs the bytes CI built.
    runtime: image
    image:
      # The default reference, used only for deploys Render starts itself (a Blueprint sync, a settings change).
      # CI deploys by digest. `:main` always points at the newest image published from main, so those deploys
      # never roll back to an old one, as a digest pinned here would. Public package: no credentials needed.
      url: ghcr.io/hinoahlee/launchpad:main
    # Can't be changed after creation. Oregon is Render's default.
    region: oregon
    # Paid (formerly "Starter", ~$7/mo): 0.5 CPU / 512 MB, always on (no spin-down), pre-deploy commands allowed.
    plan: 0.5c-512mb
    # Every deploy runs this first, in a one-off container from the new image with the same env vars. Non-zero
    # exit = the deploy fails and the old version keeps serving. It applies new migrations, so they must work
    # with the old version too (expand/contract, README "Deploy").
    preDeployCommand: node dist/migrate.js
    # Render sends traffic to a new deploy only once this returns 2xx; until then the old one keeps serving.
    healthCheckPath: /api/ready
    # Tells Render which service answers for this name, and to issue its TLS certificate. DNS side: a CNAME in
    # Cloudflare, `launchpad` -> this service's onrender.com host, DNS only (grey cloud). Keep in sync with the
    # GitHub repository variable RENDER_URL, which the deploy job polls.
    domains:
      - launchpad.noahlee.xyz
    # NODE_ENV comes from the image; Render sets PORT. Only non-defaults go here.
    envVars:
      - key: LOG_LEVEL
        value: info
      # Two proxies append to X-Forwarded-For before the app: Render's edge, which is Cloudflare for every service
      # (whatever DNS points at it; the onrender.com host is a cdn.cloudflare.net alias), then Render's load balancer
      # (the socket). The client IP is the entry before theirs. Proxying the domain through your own Cloudflare
      # (orange cloud) would add a third.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # Render fills this in with the database's private-network URL (password included) at deploy time; the
      # value never appears in this repo or in GitHub. To use another provider, swap `fromDatabase` for
      # `sync: false` and paste its URL in the dashboard: the app only reads DATABASE_URL.
      - key: DATABASE_URL
        fromDatabase:
          name: launchpad-db
          property: connectionString
      # Sentry project launchpad-api → Client Keys (DSN). `sync: false`: the value lives only in Render's dashboard,
      # never in this file. Unset: error tracking is off. (The web app's DSN is a GitHub variable, baked in by CI.)
      - key: SENTRY_DSN
        sync: false
      # Resend → Webhooks → the endpoint for https://launchpad.noahlee.xyz/api/webhooks/resend → Signing secret.
      # Unset: no webhook route, so bounces and complaints aren't recorded.
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # Auth: the public origin (sign-in links and the CSRF check use it). Keep in sync with `domains` above.
      - key: APP_URL
        value: https://launchpad.noahlee.xyz
      # Signs session cookies. Render makes a random 256-bit value once, when the Blueprint first adds the key; it
      # never appears in this repo or in GitHub. Regenerating it (dashboard) signs everyone out.
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Google sign-in: Google Cloud → Google Auth Platform → Clients → launchpad-web. Set both, or neither (Google
      # sign-in off); one alone stops the boot. The client's redirect URIs must include
      # https://launchpad.noahlee.xyz/api/auth/callback/google.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # File storage: the R2 bucket launchpad-prod (README, "File storage"). All four `sync: false` and set
      # together in the dashboard (R2 needs the keys). Unset: uploads are off. The endpoint
      # holds the Cloudflare account ID, kept out of this public file. S3_REGION stays at its default, auto.
      # The worker needs the same four (it deletes files).
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Billing: Stripe. Both `sync: false` and set together in the dashboard. The key is a restricted key
      # (rk_...) from the launchpad sandbox until launch; the price is its monthly price. Unset: billing is off.
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      # Stripe → Developers → Webhooks → the endpoint for https://launchpad.noahlee.xyz/api/webhooks/stripe → Signing
      # secret. Unset: no webhook route; subscriptions change in our database only when someone opens /account.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # Background jobs: the same image, started as `node dist/worker.js` (deploy contract, row 3). No traffic, no
  # port, no health check: Render counts it healthy while the process runs and restarts it if it exits.
  # The deploy job deploys it after the web service, so migrations (the web's pre-deploy) are already applied.
  # ~$7/mo, billed by the second. To pause it: the service's Settings → Suspend Service, and delete the GitHub
  # secret RENDER_WORKER_DEPLOY_HOOK_URL so deploys skip it. While suspended no jobs run (they wait, queued).
  - type: worker
    name: launchpad-worker
    runtime: image
    image:
      url: ghcr.io/hinoahlee/launchpad:main
    dockerCommand: node --enable-source-maps dist/worker.js
    region: oregon
    # Workers have no free plan; this is the smallest (0.5 CPU / 512 MB), as for the web service.
    plan: 0.5c-512mb
    envVars:
      - key: LOG_LEVEL
        value: info
      # Direct (port 5432) for now. If the web ever moves to the database's pooled URL (transaction mode), the
      # worker keeps this one for LISTEN, as DATABASE_DIRECT_URL or here.
      - key: DATABASE_URL
        fromDatabase:
          name: launchpad-db
          property: connectionString
      # The same DSN as the web service (one Sentry project for the API's processes).
      - key: SENTRY_DSN
        sync: false
      # Email (only the worker sends). Resend → API Keys: a production key of its own, "Sending access",
      # limited to mail.noahlee.xyz. Unset: emails are only logged, with a warning at boot.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Launchpad <hello@mail.noahlee.xyz>
      # File storage: the same four values as the web service. The worker deletes a deleted account's files and
      # abandoned uploads; without them those jobs fail (with uploads off there is nothing to delete).
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: launchpad-db
    # Name and user inside Postgres. These, the version and the region can't be changed after creation.
    databaseName: launchpad
    user: launchpad
    # Same major version as local and CI, so dumps and SQL behave the same everywhere.
    postgresMajorVersion: "17"
    region: oregon
    # Smallest paid instance (~$6/mo): point-in-time recovery (3 days on the Hobby workspace), no expiry.
    plan: 0.1c-256mb
    # Storage is billed apart (~$0.30/GB/mo); this plan defaults to 15 GB. Disks can grow later, never shrink.
    diskSizeGB: 1
    # No access from the internet: only services in this Render workspace connect, over the private network.
    # Add a CIDR here (e.g. your IP) for a one-off psql session, then remove it.
    ipAllowList: []
