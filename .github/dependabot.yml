# Dependabot opens PRs to bump what nothing else updates: the SHA-pinned actions in .github/workflows and the base
# images in Dockerfile and compose.dev.yml. npm packages are bumped by hand (one catalog), with `pnpm audit` in CI
# and Dependabot alerts flagging known vulnerabilities between bumps.
# `cooldown`: only propose releases at least 14 days old, so a hijacked release is usually caught and pulled before
# we'd adopt it (the March 2026 Trivy compromise lasted 12 hours). Security fixes skip the cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directories: ["/"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore

  - package-ecosystem: docker-compose
    directories: ["/"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
