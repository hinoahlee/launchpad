# Deploys one published image to Render by digest: the web service first, waits until the live site serves it,
# then the worker. CI calls it after `publish` on main. Run it by hand (Actions → Deploy to Render → Run workflow)
# with an older commit SHA to roll back both. GitHub holds only Render's deploy hooks, which can deploy nothing
# but this repo's image.
name: Deploy to Render

on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA of an image published from main
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    # Opt-in: without Render configured, this job is skipped instead of failing.
    if: vars.RENDER_URL != ''
    runs-on: ubuntu-latest
    # Longer than the 16-minute wait below, so the step's own error message is what you see.
    timeout-minutes: 20
    # Holds the deploy hook secret; restricted to the main branch in the repo's settings.
    environment:
      name: production
      url: ${{ vars.RENDER_URL }}
    # One deploy at a time; a newer one waits instead of cancelling a deploy halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SHA: ${{ inputs.sha }}
      RENDER_URL: ${{ vars.RENDER_URL }}
    steps:
      # Inputs go through env, never straight into the script, so a crafted value can't inject shell code.
      - name: Resolve the image digest
        id: image
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character commit SHA"; exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          digest=$(docker buildx imagetools inspect "$image:$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          echo "ref=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "Deploying $image@$digest (commit $SHA)"

      # The hook deploys exactly this digest. Render rejects any image other than the service's own repository.
      - name: Trigger the Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          REF: ${{ steps.image.outputs.ref }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is missing from the production environment"; exit 1
          fi
          sep='?'; [[ "$HOOK" == *\?* ]] && sep='&'
          url="$HOOK${sep}imgURL=$(jq -rn --arg v "$REF" '$v|@uri')"
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST "$url")
          case "$code" in
            200) echo "Deploy started: $(jq -r '.deploy.id // .id // "?"' response.json)" ;;
            202) echo "Queued behind a deploy already in progress" ;;
            *) echo "::error::Render answered HTTP $code"; cat response.json; exit 1 ;;
          esac

      # Done means users get the new build: poll the public URL (through DNS and TLS) until it reports this
      # commit. No Render API key needed. On timeout, Render's Events page says why (failed health check, ...).
      # 16 minutes: just past Render's own 15-minute limit for a deploy to pass its health check, so when this
      # fails Render has already given up, and a rollback started right after doesn't queue behind it.
      - name: Wait until the new version is live
        run: |
          deadline=$((SECONDS + 960))
          until [ "$(curl -fsS --max-time 5 "${RENDER_URL%/}/api/version" | jq -r .sha 2>/dev/null)" = "$SHA" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$RENDER_URL did not report $SHA within 16 minutes; see the service's Events in Render"
              exit 1
            fi
            sleep 10
          done
          echo "Live: $RENDER_URL serves $SHA"

      # Only now: the web's pre-deploy has applied this release's migrations, so the new worker never runs against
      # the old schema (the old worker runs against the new one meanwhile, which expand/contract allows).
      # The hook can't report back and the worker has no URL to poll, so this step only starts the deploy: its
      # result is on the worker's Events page in Render. No secret = no worker (suspended, or not created yet).
      - name: Trigger the worker deploy
        id: worker
        env:
          HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}
          REF: ${{ steps.image.outputs.ref }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Secret RENDER_WORKER_DEPLOY_HOOK_URL is not set: skipped the worker deploy"
            echo "result=skipped (no RENDER_WORKER_DEPLOY_HOOK_URL)" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sep='?'; [[ "$HOOK" == *\?* ]] && sep='&'
          url="$HOOK${sep}imgURL=$(jq -rn --arg v "$REF" '$v|@uri')"
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST "$url")
          case "$code" in
            200) echo "Worker deploy started: $(jq -r '.deploy.id // .id // "?"' response.json)" ;;
            202) echo "Worker deploy queued behind one already in progress" ;;
            *) echo "::error::Render answered HTTP $code for the worker"; cat response.json; exit 1 ;;
          esac
          echo "result=started (see the worker's Events in Render)" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          REF: ${{ steps.image.outputs.ref }}
          WORKER: ${{ steps.worker.outputs.result }}
        run: |
          {
            echo "### Deployed to Render"
            echo "Commit \`$SHA\`"
            echo
            echo "Image \`$REF\`"
            echo
            echo "Worker: $WORKER"
          } >> "$GITHUB_STEP_SUMMARY"
