# Runs `pnpm verify` (lint, typecheck, test, build) on a clean machine for every PR and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR/branch cancels the run it makes outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN gets read-only repo access; jobs ask for more only if they need it.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit SHA (tags can be moved); the comment says which release it is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs pnpm (from package.json "packageManager") and Node (from .nvmrc), restores the pnpm store
      # cache keyed on pnpm-lock.yaml, then runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - run: pnpm verify

  # Builds the production image (no push) so a broken Dockerfile fails here, not at deploy time.
  # Runs in parallel with `verify` on its own runner.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Buildx is Docker's build front end; unlike plain `docker build` it can export its layer cache.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Render, AWS and most VPSs run x86-64; say so instead of relying on the runner's default.
          platforms: linux/amd64
          push: false
          # Layer cache in GitHub's Actions cache. `mode=max` also keeps the build stage's layers (the slow
          # `pnpm fetch`), which aren't part of the final image.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On main only, once both checks pass: push the image to GitHub's registry (GHCR) as `:<commit sha>`.
  # Every deploy uses the digest printed here (decision 004). The build reuses `image`'s cached layers.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Lets GITHUB_TOKEN push to this repo's packages; granted to this job only.
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Registry names must be lowercase; a fork's owner may not be.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          # `source` links the package to this repo on GitHub; `revision` records the commit inside the image.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # A plain single-image manifest, so the digest is the image itself (provenance attestations would
          # wrap it in an index). Supply-chain attestations come with scanning in step 14.5.
          provenance: false
          cache-from: type=gha

      - name: Summary
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo "\`${IMAGE}:${GITHUB_SHA}\`"
            echo
            echo "Digest: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
