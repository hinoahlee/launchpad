# CodeQL: static analysis (SAST) of our TypeScript and of these workflow files. It reads the code without running
# it, looking for patterns like user input reaching a SQL string, a shell or a redirect. Findings appear under the
# repo's Security → Code scanning tab and as a "CodeQL" check on the PR, which fails on new high-severity ones.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  # Weekly too: new queries ship with CodeQL releases and can find old code.
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Uploads the results to code scanning; granted to this job only.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `actions` checks the workflows themselves (e.g. untrusted PR input reaching a `run:` script).
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `build-mode: none`: JavaScript and TypeScript are analyzed from source, no build needed.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Generated code, not ours to fix.
          config: |
            paths-ignore:
              - apps/web/src/routeTree.gen.ts

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
