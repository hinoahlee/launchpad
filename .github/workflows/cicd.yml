# CI/CD: verifies every PR and every push to main (lint, typecheck, test, build, e2e, image). On main it also publishes
# the image to GHCR and deploys it to Render (`deploy`, only when the RENDER_URL variable is set).
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR/branch cancels the run it makes outdated.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN gets read-only repo access; jobs ask for more only if they need it.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway Postgres for the tests, started before the steps and deleted with the job. Same image, port
    # and credentials as compose.dev.yml, so the tests' default TEST_DATABASE_URL works here unchanged. The
    # tests create and reset launchpad_test themselves.
    services:
      postgres:
        image: postgres:17.12-trixie
        env:
          POSTGRES_USER: launchpad
          POSTGRES_PASSWORD: launchpad
          POSTGRES_DB: launchpad
        ports:
          - 5433:5432
        # The job's steps start only once this passes, so tests never race the database's startup.
        options: >-
          --health-cmd "pg_isready -U launchpad -d launchpad"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      # Actions are pinned to a commit SHA (tags can be moved); the comment says which release it is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so origin/main exists: lint's diff checks (scripts/check-*.ts) compare the PR with it and
          # skip themselves on the default one-commit checkout.
          fetch-depth: 0

      # Installs pnpm (from package.json "packageManager") and Node (from .nvmrc), restores the pnpm store
      # cache keyed on pnpm-lock.yaml, then runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - run: pnpm verify:ci

      # Known vulnerabilities (CVEs) in our npm dependencies, from GitHub's advisory database. Fails on high or
      # critical only: moderate ones are reviewed case by case (Dependabot alerts list them all). A new advisory can
      # turn this red on a PR that changed nothing; that's the point: fix it (bump, or an `overrides` entry) first.
      - run: pnpm audit --audit-level high

  # End-to-end tests: the production build in a real browser, as a phone and a desktop (e2e/). A job of its own so
  # it runs at the same time as `verify` on another machine, and a red check names which kind of test failed. Not
  # optional: both must pass before an image is published.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same throwaway Postgres as `verify`: the server needs a database to boot.
    services:
      postgres:
        image: postgres:17.12-trixie
        env:
          POSTGRES_USER: launchpad
          POSTGRES_PASSWORD: launchpad
          POSTGRES_DB: launchpad
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U launchpad -d launchpad"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      # Chromium (the browser both projects use) plus the Linux libraries it needs. The version comes from the
      # installed @playwright/test. Not cached: Playwright's docs say restoring takes about as long as downloading.
      - run: pnpm --filter @launchpad/e2e exec playwright install --with-deps chromium

      # Builds the API and the web app, starts the production server and runs every test.
      - run: pnpm e2e

      # The HTML report (with traces of retried tests) to download from the run's page when something fails.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

  # Builds the production image (no push) so a broken Dockerfile fails here, not at deploy time.
  # Runs in parallel with `verify` on its own runner.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Buildx is Docker's build front end; unlike plain `docker build` it can export its layer cache.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Render, AWS and most VPSs run x86-64; say so instead of relying on the runner's default.
          platforms: linux/amd64
          push: false
          # Also into the runner's Docker, for Trivy below.
          load: true
          tags: launchpad:ci
          # GIT_SHA and the web bundle's Sentry settings (public values; empty until the repository variables
          # are set, which keeps Sentry off). Keep in sync with `publish`, so it reuses these layers.
          build-args: |
            GIT_SHA=${{ github.sha }}
            SENTRY_DSN_WEB=${{ vars.SENTRY_DSN_WEB }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT_WEB=${{ vars.SENTRY_PROJECT_WEB }}
          # Source maps go to Sentry for main builds only (the code that gets deployed), never for PRs.
          # Secrets don't change the layer cache key, so `publish` reuses this build, upload already done.
          secrets: ${{ github.event_name == 'push' && format('sentry_auth_token={0}', secrets.SENTRY_AUTH_TOKEN) || '' }}
          # Layer cache in GitHub's Actions cache. `mode=max` also keeps the build stage's layers (the slow
          # `pnpm fetch`), which aren't part of the final image.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy scans what actually ships: Alpine's packages and the node_modules inside the image, against known CVEs.
      # Run from its image pinned by digest, not via aquasecurity/trivy-action: in March 2026 an attacker moved
      # that action's tags to malware that stole CI secrets (GHSA-69fq-xp46-6x23). A digest can't be moved.
      # `--ignore-unfixed`: fail only when a fixed version exists, i.e. when there's something we can do.
      - name: Scan the image (Trivy)
        env:
          TRIVY: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 launchpad:ci

      # Misconfigurations in the Dockerfile and compose files (running as root, secrets in ENV, ...).
      - name: Scan the Dockerfile (Trivy)
        env:
          TRIVY: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY" config --severity HIGH,CRITICAL --exit-code 1 /src

  # On main only, once both checks pass: push the image to GitHub's registry (GHCR) as `:<commit sha>` and `:main`.
  # Every deploy uses the digest printed here. The build reuses `image`'s cached layers.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Lets GITHUB_TOKEN push to this repo's packages; granted to this job only.
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Registry names must be lowercase; a fork's owner may not be.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          # `:<sha>` names this build forever. `:main` moves to the newest build: it's the default reference
          # Render falls back to for deploys it starts itself (infra/render/render.yaml).
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:main
          # `source` links the package to this repo on GitHub; `revision` records the commit inside the image.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # A plain single-image manifest, so the digest is the image itself (provenance attestations would
          # wrap it in an index). No attestations yet (an SBOM or provenance would need an index too).
          provenance: false
          # Same values as in `image`, so every layer comes from its cache. The token is passed too, in case the
          # cache missed and the web bundle is rebuilt here (the upload is idempotent per release).
          build-args: |
            GIT_SHA=${{ github.sha }}
            SENTRY_DSN_WEB=${{ vars.SENTRY_DSN_WEB }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT_WEB=${{ vars.SENTRY_PROJECT_WEB }}
          secrets: sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha

      - name: Summary
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo "\`${IMAGE}:${GITHUB_SHA}\`"
            echo
            echo "Digest: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploy the image just published. Skipped unless the repo variable RENDER_URL is set.
  deploy:
    needs: publish
    if: vars.RENDER_URL != ''
    uses: ./.github/workflows/deploy-render.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
